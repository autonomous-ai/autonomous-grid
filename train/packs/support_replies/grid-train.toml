# support-replies pack — grid train run configuration.
# Do SFT on sft.jsonl FIRST (see README), then this RL pass. Edit model + endpoint.

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"   # after SFT: point at your SFT checkpoint instead

[rollout]
base_url = "http://127.0.0.1:8000/v1"  # a vLLM engine on your grid (see `grid train doctor`)
api_key_env = "GRID_TRAIN_API_KEY"
max_tokens = 220                        # replies are longer than benchmark answers
temperature = 1.0
timeout_seconds = 300

[data]
prompts_jsonl = "prompts.jsonl"         # from: python prepare_data.py --input <your export>

[rewards]
python_file = "rewards.py"              # similarity + grounding + format (judge optional)

[trainer]
group_size = 8
steps = 150
learning_rate = 1e-5
per_device_batch = 2
gradient_accumulation = 4
lora_rank = 16
lora_alpha = 32
save_every_steps = 25

[deploy]
# nodes = ["http://127.0.0.1:8000/v1"]
# adapter_name = "support-replies-v1"
