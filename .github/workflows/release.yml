name: Release

# Cut a release by pushing a tag:  git tag vX.Y.Z && git push public vX.Y.Z
# Bump pyproject.toml to X.Y.Z first and make the tag match (vX.Y.Z). shared/_version.py reads
# the version back from package metadata, so pyproject.toml is the only place to bump.
# Ships the assets install.sh downloads: standalone `grid` binaries for LINUX (x86_64 +
# arm64, one runner each — Nuitka can't cross-compile) and the universal wheel (which the
# macOS path installs via uv — a distributable macOS binary needs Apple notarization, not
# done here). Everything is published with SHA256SUMS to the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs for dry-tests (no release is created)

permissions:
  contents: write   # create the release + upload assets

jobs:
  # The same suite ci.yml runs on every PR. A tag push does NOT trigger ci.yml (`on: push:
  # branches: [main]`, and a tag is not a branch), so before this the release path ran no
  # tests whatsoever and only a human watching CI stood between a red main and a published
  # release. `release: needs:` below makes it fail-closed instead.
  #
  # It costs nothing in wall clock: ~4 min of jobs running alongside binaries that take ~10.
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    os: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ccache is not on the GitHub image, and Nuitka says so itself, twice per build:
      # "You are not using ccache, re-compilation of identical code will be slower than
      # necessary." Nuitka's Scons backend picks it up off PATH with no flag of its own.
      - name: Install patchelf (Linux standalone needs it) + ccache
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache
      # Measured on v0.3.23: of a 9m24s x86_64 build, 5m32s is gcc compiling the 591 C files
      # Nuitka generates. Most of those are the frozen dependencies (pydantic, fastapi,
      # uvicorn, starlette, httpx, stdlib), which are byte-identical between patch releases —
      # so a warm cache skips them. The key is per-arch: x86_64 and arm64 objects never mix.
      # `github.sha` in the key means every run writes a fresh entry; restore-keys takes the
      # newest prefix match, which is what makes the cache roll forward instead of going stale.
      - name: Restore the C compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.arch }}-
      - name: Build standalone binary
        env:
          # Capped well under GitHub's 10 GB per-repo cache budget, and small enough that
          # saving it costs seconds rather than eating the time the cache just saved.
          CCACHE_MAXSIZE: 500M
        run: |
          chmod +x packaging/build_binary.sh
          GRID_BUILD_PYTHON="$(command -v python3.12)" packaging/build_binary.sh
          mv dist/grid "grid-${{ matrix.os }}-${{ matrix.arch }}"
      # The hit rate is the whole justification for the cache above, so print it rather than
      # assume it. A run showing ~0 hits means the cache is not working and the step should go.
      - name: ccache statistics
        if: always() && runner.os == 'Linux'
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.os }}-${{ matrix.arch }}
          path: grid-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: [binaries, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so any git lookup here is complete. The annotated tag object
          # itself is re-fetched in the notes step below — actions/checkout lightweight-
          # ifies the pushed tag even at depth 0, so depth alone does NOT preserve it.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build universal wheel
        run: uv build --wheel
      # v0.1.1 shipped a wheel that printed the wrong version. pyproject.toml is the only
      # place the number lives (shared/_version.py reads it back from package metadata), so
      # comparing the built wheel's filename to the tag is the whole check — and it belongs
      # here rather than on the maintainer's laptop because it gates the publish: `needs:`
      # means nothing has shipped when this exits 1, and re-tagging is free.
      #
      # ref_name through env, not `${{ }}` inside run: — same reason as the notes step below.
      - name: Tag must match the wheel's version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          built="$(basename dist/grid-*-py3-none-any.whl)"
          built="${built#grid-}"; built="${built%-py3-none-any.whl}"
          if [ "v$built" != "$REF_NAME" ]; then
            echo "::error::tag is $REF_NAME but the wheel is $built."
            echo "::error::Set pyproject.toml's version to ${REF_NAME#v}, or re-tag to match."
            exit 1
          fi
          echo "tag $REF_NAME matches wheel $built"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble assets + checksums
        run: |
          cp dist/grid-*-py3-none-any.whl artifacts/
          cd artifacts
          chmod +x grid-linux-* 2>/dev/null || true
          sha256sum grid-* > SHA256SUMS
          echo "::group::SHA256SUMS"; cat SHA256SUMS; echo "::endgroup::"
      # The notes are the tag's own message: drafted with packaging/changelog.py, then
      # edited and approved by a human, who tags with the result (see the
      # release-grid-cli skill, step 5). CI generates nothing — what was reviewed at tag
      # time is exactly what publishes.
      #
      # ref_name goes through env, not `${{ }}` inside run: git allows `"`, backticks and
      # `$()` in ref names, so interpolating it into the shell would let a tag name run
      # as code.
      - name: Take the release notes from the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # actions/checkout replaces the pushed annotated tag with a LIGHTWEIGHT local
          # ref (even at fetch-depth: 0), so `git cat-file -t` below would see "commit"
          # and this step would wrongly reject a properly-annotated tag. Re-fetch the tag
          # object from origin to restore the annotation before reading it.
          git fetch --force origin tag "$REF_NAME"
          # A lightweight tag has no message of its own, and %(contents) would quietly
          # fall through to the commit's — publishing "chore(release): vX.Y.Z" as the notes.
          if [ "$(git cat-file -t "$REF_NAME")" != tag ]; then
            echo "::error::$REF_NAME is a lightweight tag, so it carries no release notes."
            echo "::error::Re-tag with:  git tag -a $REF_NAME --cleanup=verbatim -F /tmp/notes.md"
            exit 1
          fi
          git tag -l --format='%(contents)' "$REF_NAME" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::$REF_NAME has an empty tag message — no notes to publish."
            exit 1
          fi
          echo "::group::RELEASE_NOTES.md"; cat RELEASE_NOTES.md; echo "::endgroup::"

      # event_name, not just the ref: workflow_dispatch accepts a *tag* for --ref, which
      # would otherwise satisfy the refs/tags/ test and publish a "dry" run for real.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/grid-linux-x86_64
            artifacts/grid-linux-arm64
            artifacts/grid-*-py3-none-any.whl
            artifacts/SHA256SUMS
          # The approved tag message, verbatim. generate_release_notes would append a
          # second, differently-built list under it — one that silently omits whatever
          # reached main without a PR (every release bump, for one) — and would overrule
          # the editing that just happened.
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
