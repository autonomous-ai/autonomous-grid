<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L9,4 L0.5,7.5" fill="none" stroke="#6e6e6e" stroke-width="1.4"/>
    </marker>
    <marker id="ahs" markerWidth="12" markerHeight="12" refX="2.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M11.5,0.5 L3,4 L11.5,7.5" fill="none" stroke="#6e6e6e" stroke-width="1.4"/>
    </marker>
    <marker id="ahc" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L9,4 L0.5,7.5" fill="none" stroke="#c2593a" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .panel { fill:#ebeae3 }
    .node  { fill:#b9d6ee }
    .nodeq { fill:#d8e7f4 }
    .gate  { fill:#f2c9b8 }
    .h1 { fill:#3d3d3d; font-size:31px; font-weight:800 }
    .ph { fill:#5f5f5f; font-size:23px; font-weight:800 }
    .nt { fill:#3f4a52; font-size:17px; font-weight:750 }
    .ns { fill:#4d5a63; font-size:13.5px }
    .lb { fill:#5a5a5a; font-size:14px; font-weight:750 }
    .cap { fill:#7a7a7a; font-size:13px }
    .ln { stroke:#6e6e6e; stroke-width:1.6; fill:none }
    .lnc { stroke:#c2593a; stroke-width:1.8; fill:none }
  </style>

  <rect width="1440" height="820" fill="#ffffff"/>
  <text x="720" y="56" text-anchor="middle" class="h1">How a model trains on the machines you already own</text>

  <!-- ============ LEFT: your work ============ -->
  <rect x="40" y="96" width="330" height="668" rx="26" class="panel"/>
  <text x="205" y="150" text-anchor="middle" class="ph">Your work</text>

  <rect x="76" y="196" width="258" height="150" rx="10" class="nodeq"/>
  <text x="96" y="228" class="nt">Today, through the grid</text>
  <text x="96" y="256" class="ns">every answer it gave is kept —</text>
  <text x="96" y="278" class="ns">locally, redacted, on your disk</text>
  <text x="96" y="308" class="ns">a person edits one → that is truth</text>
  <text x="96" y="330" class="ns">a person bins one → never imitated</text>

  <rect x="76" y="376" width="258" height="128" rx="10" class="nodeq"/>
  <text x="96" y="408" class="nt">Or an export you own</text>
  <text x="96" y="436" class="ns">the tickets your team resolved,</text>
  <text x="96" y="458" class="ns">the deals that closed, the labels</text>
  <text x="96" y="480" class="ns">someone chose by hand</text>

  <rect x="76" y="534" width="258" height="106" rx="10" class="nodeq"/>
  <text x="96" y="566" class="nt">Nothing leaves</text>
  <text x="96" y="594" class="ns">no upload, no vendor, no account —</text>
  <text x="96" y="616" class="ns">the data, the attempts and the</text>
  <text x="96" y="638" class="ns">weights all stay on your network</text>

  <!-- between the panels -->
  <path d="M382 300 L472 300" class="ln" marker-end="url(#ah)"/>
  <text x="427" y="288" text-anchor="middle" class="lb">Tasks</text>

  <path d="M472 560 L382 560" class="ln" marker-end="url(#ah)"/>
  <text x="427" y="548" text-anchor="middle" class="lb">A better model</text>
  <text x="427" y="586" text-anchor="middle" class="cap">…or nothing at all</text>

  <!-- ============ RIGHT: the training system ============ -->
  <rect x="486" y="96" width="914" height="668" rx="26" class="panel"/>
  <text x="943" y="150" text-anchor="middle" class="ph">Training, on your grid</text>

  <!-- the trainer -->
  <rect x="740" y="216" width="380" height="152" rx="10" class="node"/>
  <text x="930" y="256" text-anchor="middle" class="nt" font-size="20">The trainer</text>
  <text x="930" y="284" text-anchor="middle" class="ns">one machine — an NVIDIA box, or a Mac</text>
  <text x="930" y="316" text-anchor="middle" class="ns">holds the weights · grades the attempts</text>
  <text x="930" y="338" text-anchor="middle" class="ns">one optimizer step on a small add-on layer</text>
  <text x="930" y="360" text-anchor="middle" class="ns">(LoRA, ~84 MB — the base is never touched)</text>

  <!-- the gate -->
  <rect x="520" y="238" width="180" height="112" rx="10" class="gate"/>
  <text x="610" y="272" text-anchor="middle" class="nt">The gate</text>
  <text x="610" y="298" text-anchor="middle" class="ns">is it better than</text>
  <text x="610" y="318" text-anchor="middle" class="ns">what we serve, on</text>
  <text x="610" y="338" text-anchor="middle" class="ns">work it never saw?</text>
  <path d="M732 292 L710 292" class="lnc" marker-end="url(#ahc)"/>

  <!-- the adapter -->
  <rect x="1164" y="238" width="196" height="112" rx="10" class="node"/>
  <text x="1262" y="272" text-anchor="middle" class="nt">The adapter</text>
  <text x="1262" y="298" text-anchor="middle" class="ns">what learning</text>
  <text x="1262" y="318" text-anchor="middle" class="ns">produces — and the</text>
  <text x="1262" y="338" text-anchor="middle" class="ns">only thing that moves</text>
  <path d="M1128 280 L1156 280" class="ln" marker-end="url(#ah)"/>
  <path d="M1156 308 L1128 308" class="ln" marker-end="url(#ah)"/>

  <!-- rollout nodes -->
  <rect x="530" y="530" width="248" height="112" rx="10" class="node"/>
  <text x="654" y="566" text-anchor="middle" class="nt">MacBook Pro × 12</text>
  <text x="654" y="592" text-anchor="middle" class="ns">MLX · grid train serve</text>
  <text x="654" y="614" text-anchor="middle" class="ns">writes 1 attempt each,</text>
  <text x="654" y="634" text-anchor="middle" class="ns">while nobody is using them</text>

  <rect x="812" y="530" width="248" height="112" rx="10" class="node"/>
  <text x="936" y="566" text-anchor="middle" class="nt">Mac Studio</text>
  <text x="936" y="592" text-anchor="middle" class="ns">MLX · 512 GB</text>
  <text x="936" y="614" text-anchor="middle" class="ns">writes 8 at a time,</text>
  <text x="936" y="634" text-anchor="middle" class="ns">and judges when asked</text>

  <rect x="1094" y="530" width="248" height="112" rx="10" class="node"/>
  <text x="1218" y="566" text-anchor="middle" class="nt">The RTX box</text>
  <text x="1218" y="592" text-anchor="middle" class="ns">vLLM · 4090 or PRO 6000</text>
  <text x="1218" y="614" text-anchor="middle" class="ns">writes 8–16 at a time,</text>
  <text x="1218" y="634" text-anchor="middle" class="ns">or is the trainer itself</text>

  <!-- trainer <-> rollout nodes, through the grid -->
  <rect x="806" y="418" width="260" height="52" rx="10" class="nodeq"/>
  <text x="936" y="450" text-anchor="middle" class="nt">The grid — one endpoint</text>
  <path d="M916 376 L916 410" class="ln" marker-end="url(#ah)"/>
  <path d="M956 410 L956 376" class="ln" marker-end="url(#ah)"/>
  <text x="898" y="398" text-anchor="end" class="lb">One task,</text>
  <text x="898" y="416" text-anchor="end" class="lb">eight times</text>
  <text x="974" y="398" class="lb">The attempts, and</text>
  <text x="974" y="416" class="lb">the tokens sampled</text>

  <path d="M880 478 L700 522" class="ln" marker-end="url(#ah)"/>
  <path d="M726 530 L900 486" class="ln" marker-end="url(#ah)"/>
  <path d="M926 478 L926 522" class="ln" marker-end="url(#ah)"/>
  <path d="M952 522 L952 478" class="ln" marker-end="url(#ah)"/>
  <path d="M992 478 L1172 522" class="ln" marker-end="url(#ah)"/>
  <path d="M1146 530 L972 486" class="ln" marker-end="url(#ah)"/>


  <!-- self loops: each machine writes several attempts at once -->
  <path d="M600 648 C600 692, 700 692, 700 652" class="ln" marker-end="url(#ah)"/>
  <path d="M882 648 C882 692, 982 692, 982 652" class="ln" marker-end="url(#ah)"/>
  <path d="M1164 648 C1164 692, 1264 692, 1264 652" class="ln" marker-end="url(#ah)"/>
  <text x="943" y="722" text-anchor="middle" class="cap">each machine writes several attempts at once — the attempts are independent, so they fan out perfectly</text>
</svg>
