<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 340" font-family="Avenir Next, Nunito, Poppins, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="13" markerHeight="13" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9.5,4.5 L1,8" fill="none" stroke="#8a8a8a" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .g  { fill:#eef7ea; stroke:#7cb342; stroke-width:1.7 }
    .p  { fill:#f0eefb; stroke:#7a6fd1; stroke-width:1.7 }
    .c  { fill:#fdf0ec; stroke:#e8967c; stroke-width:1.7 }
    .tg { fill:#4a8b2c; font-size:18px; font-weight:700 }
    .tp { fill:#5b4fc0; font-size:18px; font-weight:700 }
    .tc { fill:#c2593a; font-size:18px; font-weight:700 }
    .s  { fill:#5c6470; font-size:13.5px }
    .l  { fill:#3a3a3a; font-size:15px }
    .ln { fill:none; stroke:#8a8a8a; stroke-width:1.9 }
    .dn { fill:none; stroke:#a8a8a8; stroke-width:1.9; stroke-dasharray:7 6 }
  </style>
  <rect width="1240" height="340" fill="#fff"/>

  <ellipse cx="80" cy="150" rx="62" ry="40" class="c"/>
  <text x="80" y="145" text-anchor="middle" class="tc">Your</text>
  <text x="80" y="167" text-anchor="middle" class="tc">work</text>

  <rect x="196" y="108" width="230" height="84" rx="3" class="g"/>
  <text x="311" y="145" text-anchor="middle" class="tg">Machines you own</text>
  <text x="311" y="169" text-anchor="middle" class="s">eight attempts a task</text>

  <rect x="502" y="108" width="230" height="84" rx="3" class="p"/>
  <text x="617" y="145" text-anchor="middle" class="tp">One trainer</text>
  <text x="617" y="169" text-anchor="middle" class="s">a Mac or an NVIDIA box</text>

  <rect x="808" y="108" width="170" height="84" rx="3" class="p"/>
  <text x="893" y="145" text-anchor="middle" class="tp">The gate</text>
  <text x="893" y="169" text-anchor="middle" class="s">better than today's?</text>

  <rect x="1054" y="30" width="160" height="60" rx="3" class="g"/>
  <text x="1134" y="67" text-anchor="middle" class="tg">Served</text>

  <rect x="1054" y="216" width="160" height="60" rx="3" class="c"/>
  <text x="1134" y="253" text-anchor="middle" class="tc">Binned</text>

  <path d="M144 150 H186" class="ln" marker-end="url(#a)"/>
  <path d="M426 150 H492" class="ln" marker-end="url(#a)"/>
  <text x="459" y="138" text-anchor="middle" class="l">attempts</text>
  <path d="M732 150 H798" class="ln" marker-end="url(#a)"/>
  <text x="765" y="138" text-anchor="middle" class="l">adapter</text>

  <path d="M978 132 C1018 132, 1022 60, 1044 60" class="ln" marker-end="url(#a)"/>
  <path d="M978 168 C1018 168, 1022 246, 1044 246" class="dn" marker-end="url(#a)"/>

  <path d="M617 192 V250 H311 V202" class="dn" marker-end="url(#a)"/>
  <text x="464" y="272" text-anchor="middle" class="l">the new adapter, every two steps</text>
</svg>
