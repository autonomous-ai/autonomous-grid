<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" shape-rendering="geometricPrecision"
     font-family="Helvetica, Arial, sans-serif" stroke-linejoin="miter" stroke-linecap="butt">
  <style>
    .n   { stroke:#000; stroke-width:2; fill:#fff }
    .dot { fill:#000 }
    .e   { stroke:#000; stroke-width:2; fill:none }
    .hd  { font-size:20px; fill:#000 }
    .sy  { font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:24px; fill:#000 }
  </style>
  <rect width="720" height="300" fill="#fff"/>

  <g class="hd" text-anchor="middle">
    <text x="120" y="40">MacBook Pro</text>
    <text x="360" y="40">Mac Studio</text>
    <text x="600" y="40">RTX box</text>
  </g>

  <!-- each machine takes one task and writes its own group -->
  <g>
    <circle cx="120" cy="88" r="15" class="n"/>
    <circle cx="360" cy="88" r="15" class="n"/>
    <circle cx="600" cy="88" r="15" class="n"/>
    <text x="120" y="70" text-anchor="middle" class="sy">s</text>
    <text x="360" y="70" text-anchor="middle" class="sy">s</text>
    <text x="600" y="70" text-anchor="middle" class="sy">s</text>
  </g>

  <g class="e">
    <path d="M120 103 L36 190"/><path d="M120 103 L60 190"/><path d="M120 103 L84 190"/>
    <path d="M120 103 L108 190"/><path d="M120 103 L132 190"/><path d="M120 103 L156 190"/>
    <path d="M120 103 L180 190"/><path d="M120 103 L204 190"/>
    <path d="M360 103 L276 190"/><path d="M360 103 L300 190"/><path d="M360 103 L324 190"/>
    <path d="M360 103 L348 190"/><path d="M360 103 L372 190"/><path d="M360 103 L396 190"/>
    <path d="M360 103 L420 190"/><path d="M360 103 L444 190"/>
    <path d="M600 103 L516 190"/><path d="M600 103 L540 190"/><path d="M600 103 L564 190"/>
    <path d="M600 103 L588 190"/><path d="M600 103 L612 190"/><path d="M600 103 L636 190"/>
    <path d="M600 103 L660 190"/><path d="M600 103 L684 190"/>
  </g>
  <g class="dot">
    <circle cx="36" cy="198" r="7.5"/><circle cx="60" cy="198" r="7.5"/><circle cx="84" cy="198" r="7.5"/>
    <circle cx="108" cy="198" r="7.5"/><circle cx="132" cy="198" r="7.5"/><circle cx="156" cy="198" r="7.5"/>
    <circle cx="180" cy="198" r="7.5"/><circle cx="204" cy="198" r="7.5"/>
    <circle cx="276" cy="198" r="7.5"/><circle cx="300" cy="198" r="7.5"/><circle cx="324" cy="198" r="7.5"/>
    <circle cx="348" cy="198" r="7.5"/><circle cx="372" cy="198" r="7.5"/><circle cx="396" cy="198" r="7.5"/>
    <circle cx="420" cy="198" r="7.5"/><circle cx="444" cy="198" r="7.5"/>
    <circle cx="516" cy="198" r="7.5"/><circle cx="540" cy="198" r="7.5"/><circle cx="564" cy="198" r="7.5"/>
    <circle cx="588" cy="198" r="7.5"/><circle cx="612" cy="198" r="7.5"/><circle cx="636" cy="198" r="7.5"/>
    <circle cx="660" cy="198" r="7.5"/><circle cx="684" cy="198" r="7.5"/>
  </g>

  <g class="e">
    <path d="M120 214 L336 258"/><path d="M360 214 V258"/><path d="M600 214 L384 258"/>
  </g>
  <g fill="#000" stroke="#000" stroke-width="2">
    <path d="M340 259 l-3 -14 l13 9 Z"/><path d="M360 264 l-5 -13.5 h10 Z"/><path d="M380 259 l3 -14 l-13 9 Z"/>
  </g>
  <text x="360" y="290" text-anchor="middle" class="hd">trainer</text>
</svg>
