<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" shape-rendering="geometricPrecision"
     font-family="Helvetica, Arial, sans-serif" stroke-linejoin="miter" stroke-linecap="butt">
  <style>
    .box  { fill:#fff; stroke:#000; stroke-width:3 }
    .pri  { fill:none; stroke:#000; stroke-width:4.5 }
    .sec  { fill:none; stroke:#000; stroke-width:2.25 }
    .rule { fill:none; stroke:#000; stroke-width:1.5; stroke-dasharray:3 3 }
    .nm   { font-size:36px; fill:#000 }
    .wd   { font-size:25px; fill:#000 }
    .sy   { font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:30px; fill:#000 }
    .sub  { font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:19px; fill:#000 }
  </style>
  <rect width="720" height="264" fill="#fff"/>

  <!-- the two actors; widths sized to their own labels, one shared centre -->
  <rect x="306.6" y="6.6" width="126" height="77" rx="13" ry="13" class="box"/>
  <text x="369.6" y="57" text-anchor="middle" class="nm">Model</text>

  <rect x="245.7" y="169.7" width="248" height="84" rx="13" ry="13" class="box"/>
  <text x="369.6" y="223" text-anchor="middle" class="nm">Work</text>

  <!-- attempt: model -> work, down the right -->
  <path d="M432.6 45.1 H641.3 V211.7 H493.7" class="pri"/>
  <path d="M493.7 211.7 l13.5 -5 v10 Z" fill="#000" stroke="#000" stroke-width="4.5"/>
  <rect x="556" y="88" width="112" height="66" fill="#fff"/>
  <text x="564" y="112" class="wd">attempt</text>
  <text x="564" y="146" class="sy">A<tspan class="sub" dy="7">t</tspan></text>

  <!-- task: work -> model, outer return lane -->
  <path d="M245.7 197.7 H66.3 V32 H306.6" class="pri"/>
  <path d="M306.6 32 l-13.5 -5 v10 Z" fill="#000" stroke="#000" stroke-width="4.5" transform="translate(13.5,0)"/>
  <rect x="0" y="86" width="60" height="68" fill="#fff"/>
  <text x="56" y="110" text-anchor="end" class="wd">task</text>
  <text x="56" y="146" text-anchor="end" class="sy">S<tspan class="sub" dy="7">t</tspan></text>

  <!-- reward: work -> model, inner lane, one clearance in -->
  <path d="M245.7 225.7 H94.8 V60.5 H306.6" class="sec"/>
  <path d="M306.6 60.5 l-11 -4 v8 Z" fill="#000" stroke="#000" stroke-width="2.25" transform="translate(11,0)"/>
  <rect x="106" y="86" width="104" height="68" fill="#fff"/>
  <text x="114" y="110" class="wd">reward</text>
  <text x="114" y="146" class="sy">R<tspan class="sub" dy="7">t</tspan></text>
</svg>
