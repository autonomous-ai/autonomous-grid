<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" shape-rendering="geometricPrecision"
     font-family="Helvetica, Arial, sans-serif" stroke-linejoin="miter" stroke-linecap="butt">
  <style>
    .n    { stroke:#000; stroke-width:2; fill:#fff }
    .dot  { fill:#000 }
    .e    { stroke:#000; stroke-width:2; fill:none }
    .arc  { stroke:#000; stroke-width:2; fill:none }
    .base { stroke:#000; stroke-width:1.5; fill:none; stroke-dasharray:4 4 }
    .wd   { font-size:22px; fill:#000 }
    .sy   { font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:30px; fill:#000 }
    .num  { font-family:Georgia,'Times New Roman',serif; font-size:19px; fill:#000 }
  </style>
  <rect width="720" height="330" fill="#fff"/>

  <!-- the task -->
  <circle cx="360" cy="46" r="15" class="n"/>
  <text x="360" y="22" text-anchor="middle" class="sy">s</text>

  <!-- eight attempts, one fan, dot height = its reward -->
  <g class="e">
    <path d="M360 61 L84 150"/>  <path d="M360 61 L176 176"/> <path d="M360 61 L268 188"/>
    <path d="M360 61 L360 202"/> <path d="M360 61 L452 214"/> <path d="M360 61 L544 232"/>
    <path d="M360 61 L636 244"/> <path d="M360 61 L636 150"/>
  </g>
  <g class="dot">
    <circle cx="84"  cy="150" r="7.5"/> <circle cx="176" cy="176" r="7.5"/>
    <circle cx="268" cy="188" r="7.5"/> <circle cx="360" cy="202" r="7.5"/>
    <circle cx="452" cy="214" r="7.5"/> <circle cx="544" cy="232" r="7.5"/>
    <circle cx="636" cy="244" r="7.5"/> <circle cx="636" cy="150" r="7.5"/>
  </g>

  <!-- their own mean, the only bar there is -->
  <path d="M60 196 H660" class="base"/>
  <text x="668" y="202" class="sy">r̄</text>
  <path d="M291.5 83.2 A72 72 0 0 0 428.5 83.2" class="arc"/>
  <text x="278" y="106" text-anchor="end" class="wd">mean</text>

  <!-- above it and below it -->
  <text x="60" y="176" class="wd">above</text>
  <text x="60" y="266" class="wd">below</text>

  <!-- one step -->
  <path d="M360 214 V292" class="e"/>
  <path d="M360 292 l-5 -13.5 h10 Z" fill="#000" stroke="#000" stroke-width="2" transform="translate(0,13.5)"/>
  <text x="374" y="300" class="wd">step</text>
</svg>
