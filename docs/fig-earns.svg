<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" shape-rendering="geometricPrecision"
     font-family="Helvetica, Arial, sans-serif" stroke-linejoin="miter" stroke-linecap="butt">
  <style>
    .n   { stroke:#000; stroke-width:2; fill:#fff }
    .dot { fill:#000 }
    .term{ fill:#a9a9a9; stroke:#000; stroke-width:2 }
    .e   { stroke:#000; stroke-width:2; fill:none }
    .hd  { font-size:20px; fill:#000 }
    .num { font-family:Georgia,'Times New Roman',serif; font-size:22px; fill:#000 }
  </style>
  <rect width="720" height="260" fill="#fff"/>

  <!-- four columns: one served answer, one thing that became of it -->
  <g class="hd" text-anchor="middle">
    <text x="136" y="42">rewritten</text>
    <text x="304" y="42">teacher</text>
    <text x="472" y="42">sent</text>
    <text x="640" y="42">binned</text>
  </g>

  <g class="n">
    <circle cx="136" cy="88" r="15"/> <circle cx="304" cy="88" r="15"/>
    <circle cx="472" cy="88" r="15"/> <circle cx="640" cy="88" r="15"/>
  </g>

  <g class="e">
    <path d="M136 103 V166"/> <path d="M304 103 V166"/>
    <path d="M472 103 V166"/> <path d="M640 103 V166"/>
  </g>
  <g fill="#000" stroke="#000" stroke-width="2">
    <path d="M136 175 l-5 -13.5 h10 Z"/> <path d="M304 175 l-5 -13.5 h10 Z"/>
    <path d="M472 175 l-5 -13.5 h10 Z"/> <path d="M640 175 l-5 -13.5 h10 Z"/>
  </g>

  <circle cx="136" cy="190" r="7.5" class="dot"/>
  <circle cx="304" cy="190" r="7.5" class="dot"/>
  <circle cx="472" cy="190" r="7.5" class="dot"/>
  <rect x="626.4" y="176.4" width="27.3" height="27.3" class="term"/>

  <g class="num" text-anchor="middle">
    <text x="136" y="238">1.0</text>
    <text x="304" y="238">0.8</text>
    <text x="472" y="238">0.6</text>
  </g>
</svg>
