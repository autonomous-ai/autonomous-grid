<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 380" font-family="Avenir Next, Nunito, Poppins, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="13" markerHeight="13" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9.5,4.5 L1,8" fill="none" stroke="#8a8a8a" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .g  { fill:#eef7ea; stroke:#7cb342; stroke-width:1.7 }
    .p  { fill:#f0eefb; stroke:#7a6fd1; stroke-width:1.7 }
    .c  { fill:#fdf0ec; stroke:#e8967c; stroke-width:1.7 }
    .tg { fill:#4a8b2c; font-size:18px; font-weight:700 }
    .tp { fill:#5b4fc0; font-size:18px; font-weight:700 }
    .tc { fill:#c2593a; font-size:18px; font-weight:700 }
    .s  { fill:#5c6470; font-size:13.5px }
    .l  { fill:#3a3a3a; font-size:15px }
    .ln { fill:none; stroke:#8a8a8a; stroke-width:1.9 }
    .dn { fill:none; stroke:#a8a8a8; stroke-width:1.9; stroke-dasharray:7 6 }
  </style>
  <rect width="1330" height="380" fill="#fff"/>

  <ellipse cx="78" cy="150" rx="60" ry="40" class="c"/>
  <text x="78" y="145" text-anchor="middle" class="tc">The</text>
  <text x="78" y="167" text-anchor="middle" class="tc">workday</text>

  <rect x="186" y="110" width="196" height="80" rx="3" class="g"/>
  <text x="284" y="145" text-anchor="middle" class="tg">Every answer</text>
  <text x="284" y="168" text-anchor="middle" class="tg">is kept</text>

  <rect x="438" y="110" width="196" height="80" rx="3" class="p"/>
  <text x="536" y="145" text-anchor="middle" class="tp">What happened</text>
  <text x="536" y="168" text-anchor="middle" class="tp">is attached</text>
  <text x="536" y="212" text-anchor="middle" class="s">evening</text>

  <rect x="690" y="110" width="196" height="80" rx="3" class="g"/>
  <text x="788" y="145" text-anchor="middle" class="tg">The climb</text>
  <text x="788" y="168" text-anchor="middle" class="tg">runs</text>
  <text x="788" y="212" text-anchor="middle" class="s">23:00, on idle machines</text>

  <rect x="942" y="110" width="150" height="80" rx="3" class="p"/>
  <text x="1017" y="156" text-anchor="middle" class="tp">The gate</text>
  <text x="1017" y="212" text-anchor="middle" class="s">07:00</text>

  <rect x="1160" y="14" width="150" height="56" rx="3" class="g"/>
  <text x="1235" y="49" text-anchor="middle" class="tg">Served</text>

  <rect x="1160" y="248" width="150" height="56" rx="3" class="c"/>
  <text x="1235" y="283" text-anchor="middle" class="tc">Binned</text>

  <path d="M140 150 H176" class="ln" marker-end="url(#a)"/>
  <path d="M382 150 H428" class="ln" marker-end="url(#a)"/>
  <path d="M634 150 H680" class="ln" marker-end="url(#a)"/>
  <path d="M886 150 H932" class="ln" marker-end="url(#a)"/>

  <path d="M1092 132 C1124 132, 1128 42, 1150 42" class="ln" marker-end="url(#a)"/>
  <text x="1108" y="100" text-anchor="middle" class="l">better</text>
  <path d="M1092 168 C1124 168, 1128 276, 1150 276" class="dn" marker-end="url(#a)"/>
  <text x="1110" y="228" text-anchor="middle" class="l">not better</text>

  <path d="M1235 70 V92 H78 V100" class="dn" marker-end="url(#a)"/>
  <text x="640" y="82" text-anchor="middle" class="l">tomorrow, on a better model</text>
</svg>
