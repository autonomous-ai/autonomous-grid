<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" shape-rendering="geometricPrecision"
     font-family="Helvetica, Arial, sans-serif" stroke-linejoin="miter" stroke-linecap="butt">
  <style>
    .box  { fill:#fff; stroke:#000; stroke-width:3 }
    .data { fill:#d0d1d3; stroke:#000; stroke-width:3 }
    .term { fill:#a9a9a9; stroke:#000; stroke-width:3 }
    .pri  { fill:none; stroke:#000; stroke-width:4.5 }
    .sec  { fill:none; stroke:#000; stroke-width:2.25 }
    .spine{ fill:none; stroke:#9eb5ce; stroke-width:9 }
    .nm   { font-size:30px; fill:#000 }
    .sm   { font-size:22px; fill:#000 }
    .wd   { font-size:20px; fill:#000 }
  </style>
  <rect width="720" height="430" fill="#fff"/>

  <rect x="286" y="16" width="148" height="66" rx="13" ry="13" class="box"/>
  <text x="360" y="58" text-anchor="middle" class="nm">Serving</text>

  <rect x="276" y="120" width="168" height="48" rx="24" ry="24" class="data"/>
  <text x="360" y="152" text-anchor="middle" class="sm">answers</text>

  <rect x="276" y="206" width="168" height="48" rx="24" ry="24" class="data"/>
  <text x="360" y="238" text-anchor="middle" class="sm">outcomes</text>

  <rect x="286" y="292" width="148" height="66" rx="13" ry="13" class="box"/>
  <text x="360" y="334" text-anchor="middle" class="nm">Training</text>

  <g class="pri">
    <path d="M360 82 V112"/><path d="M360 168 V198"/><path d="M360 254 V284"/>
  </g>
  <g fill="#000" stroke="#000" stroke-width="4.5">
    <path d="M360 112 l-6 -15 h12 Z" transform="translate(0,15)"/>
    <path d="M360 198 l-6 -15 h12 Z" transform="translate(0,15)"/>
    <path d="M360 284 l-6 -15 h12 Z" transform="translate(0,15)"/>
  </g>

  <path d="M434 325 H612 V49 H434" class="spine"/>
  <path d="M446 49 l-14 -6 v12 Z" fill="#9eb5ce" stroke="#9eb5ce" stroke-width="9"/>

  <path d="M286 325 H108 V392" class="sec"/>
  <path d="M108 392 l-5 -14 h10 Z" fill="#000" stroke="#000" stroke-width="2.25" transform="translate(0,14)"/>
  <rect x="94.4" y="392" width="27.3" height="27.3" class="term"/>

  <path d="M420 358 m-60 26 a72 72 0 0 0 -156 -18" class="sec"/>
  <text x="152" y="360" text-anchor="end" class="wd">gate</text>
  <text x="628" y="196" class="wd">better</text>
  <text x="132" y="440" text-anchor="middle" class="wd"></text>
</svg>
