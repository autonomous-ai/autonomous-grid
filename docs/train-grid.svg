<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 812" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="0.5" cy="0.30" r="0.92">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceff4"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#d7dce4"/>
    </pattern>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb0e6"/>
      <stop offset="1" stop-color="#3a8cc8"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea371"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#e08c07"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b8ff2"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="lineDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a020"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="lineUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3f95d4"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="lineUp2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#e0a020"/>
    </linearGradient>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arrAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e0a020"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3a8cc8"/>
    </marker>
    <marker id="arrIndigo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <filter id="sh" x="-40%" y="-50%" width="180%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.20"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <symbol id="mac-studio" viewBox="0 0 28 24">
      <rect x="3" y="3" width="22" height="18" rx="2.5" fill="#eef6fc"/>
      <line x1="3" y1="7.5" x2="25" y2="7.5" stroke="#3a8cc8" stroke-width="1.1"/>
      <circle cx="14" cy="14.5" r="3.4" fill="none" stroke="#3a8cc8" stroke-width="1.3"/>
      <circle cx="14" cy="14.5" r="0.9" fill="#3a8cc8"/>
    </symbol>
    <symbol id="macbook" viewBox="0 0 30 22">
      <rect x="6" y="2.5" width="18" height="12" rx="1.2" fill="#eef6fc"/>
      <rect x="7.5" y="4" width="15" height="9" rx="0.6" fill="#3a8cc8" opacity="0.35"/>
      <rect x="13" y="2.5" width="4" height="1.4" rx="0.7" fill="#3a8cc8"/>
      <path d="M2.5 19.5 L27.5 19.5 L25 14.5 L5 14.5 Z" fill="#eef6fc"/>
      <rect x="12.5" y="15.6" width="5" height="1" rx="0.5" fill="#3a8cc8"/>
    </symbol>
    <symbol id="gpu-card" viewBox="0 0 32 18">
      <rect x="0.5" y="2" width="2.5" height="14" rx="0.5" fill="#eef6fc"/>
      <rect x="3" y="3.5" width="27" height="11" rx="1.6" fill="#eef6fc"/>
      <circle cx="11" cy="9" r="3.6" fill="none" stroke="#3a8cc8" stroke-width="1.2"/>
      <circle cx="11" cy="9" r="0.9" fill="#3a8cc8"/>
      <circle cx="22" cy="9" r="3.6" fill="none" stroke="#3a8cc8" stroke-width="1.2"/>
      <circle cx="22" cy="9" r="0.9" fill="#3a8cc8"/>
    </symbol>
    <symbol id="gpu-amber" viewBox="0 0 32 18">
      <rect x="0.5" y="2" width="2.5" height="14" rx="0.5" fill="#fff6e2"/>
      <rect x="3" y="3.5" width="27" height="11" rx="1.6" fill="#fff6e2"/>
      <circle cx="11" cy="9" r="3.6" fill="none" stroke="#c07a05" stroke-width="1.2"/>
      <circle cx="11" cy="9" r="0.9" fill="#c07a05"/>
      <circle cx="22" cy="9" r="3.6" fill="none" stroke="#c07a05" stroke-width="1.2"/>
      <circle cx="22" cy="9" r="0.9" fill="#c07a05"/>
    </symbol>
    <symbol id="studio-amber" viewBox="0 0 28 24">
      <rect x="3" y="3" width="22" height="18" rx="2.5" fill="#fff6e2"/>
      <line x1="3" y1="7.5" x2="25" y2="7.5" stroke="#c07a05" stroke-width="1.1"/>
      <circle cx="14" cy="14.5" r="3.4" fill="none" stroke="#c07a05" stroke-width="1.3"/>
      <circle cx="14" cy="14.5" r="0.9" fill="#c07a05"/>
    </symbol>
  </defs>

  <rect width="1120" height="812" fill="url(#bgGrad)"/>
  <rect width="1120" height="812" fill="url(#dots)"/>

  <!-- ============ TOP: the trainer ============ -->
  <text x="560" y="40" text-anchor="middle" fill="#8a96a8" font-size="12" letter-spacing="2.5" font-weight="700">THE TRAINER — ONE MACHINE HOLDS THE WEIGHTS</text>

  <ellipse cx="430" cy="112" rx="250" ry="58" fill="#e0a020" opacity="0.18" filter="url(#glow)"/>
  <g filter="url(#sh)"><rect x="196" y="56" width="468" height="116" rx="18" fill="url(#trainGrad)"/></g>
  <rect x="204" y="62" width="452" height="24" rx="12" fill="#ffffff" opacity="0.12"/>
  <text x="220" y="86" fill="#ffffff" font-size="17" font-weight="800">The Trainer</text>
  <text x="655" y="86" text-anchor="end" fill="#fff4dc" font-size="12">grades the attempts · adjusts the weights · runs the gate</text>

  <line x1="430" y1="98" x2="430" y2="164" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
  <text x="220" y="112"><tspan fill="#fff0cf" font-size="9.5" letter-spacing="0.6">NVIDIA</tspan></text>
  <text x="220" y="131"><tspan fill="#ffffff" font-weight="700" font-size="13">RTX 4090 · 5090 · PRO 6000</tspan></text>
  <text x="220" y="150"><tspan fill="#fff4dc" font-size="11.5">TRL + peft (torch)</tspan></text>
  <text x="452" y="112"><tspan fill="#fff0cf" font-size="9.5" letter-spacing="0.6">OR APPLE</tspan></text>
  <text x="452" y="131"><tspan fill="#ffffff" font-weight="700" font-size="13">Mac Studio · MacBook Pro</tspan></text>
  <text x="452" y="150"><tspan fill="#fff4dc" font-size="11.5">MLX — imitation rung today</tspan></text>
  <use href="#gpu-amber" x="352" y="98" width="26" height="15"/>
  <use href="#studio-amber" x="620" y="97" width="21" height="18"/>

  <!-- the gate, beside the trainer -->
  <g filter="url(#sh)"><rect x="700" y="56" width="224" height="116" rx="18" fill="url(#gateGrad)"/></g>
  <rect x="708" y="62" width="208" height="24" rx="12" fill="#ffffff" opacity="0.12"/>
  <text x="722" y="86" fill="#ffffff" font-size="17" font-weight="800">The Gate</text>
  <text x="722" y="112"><tspan fill="#dcdcfb" font-size="11.5">scores the trained model against</tspan></text>
  <text x="722" y="129"><tspan fill="#dcdcfb" font-size="11.5">the one you serve, on work it</tspan></text>
  <text x="722" y="146"><tspan fill="#dcdcfb" font-size="11.5">has never seen</tspan></text>
  <text x="722" y="164"><tspan fill="#ffffff" font-weight="700" font-size="11.5">it loses → nothing changes</tspan></text>
  <path d="M672 114 L694 114" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arrIndigo)"/>


  <!-- ============ MIDDLE: the grid ============ -->
  <ellipse cx="560" cy="308" rx="440" ry="66" fill="#10b981" opacity="0.20" filter="url(#glow)"/>
  <g filter="url(#sh)"><rect x="110" y="262" width="900" height="92" rx="20" fill="url(#gridGrad)"/></g>
  <rect x="118" y="268" width="884" height="30" rx="15" fill="#ffffff" opacity="0.10"/>
  <text x="560" y="306" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">Your Grid</text>
  <text x="560" y="334" text-anchor="middle" fill="#f3fff9" font-size="17">fans every task across whatever is free — laptops join and leave mid-run</text>

  <!-- ============ arrows: trainer <-> grid ============ -->
  <g stroke-width="2.6" fill="none">
    <path d="M330 176 C330 216, 262 222, 262 262" stroke="url(#lineDown)" marker-end="url(#arrGreen)"/>
    <path d="M596 262 C596 222, 530 216, 530 176" stroke="url(#lineUp2)" marker-end="url(#arrAmber)"/>
  </g>
  <text x="252" y="216" text-anchor="end" fill="#7a6a45" font-size="12.5" font-weight="600">one task, eight times</text>
  <text x="612" y="216" fill="#3f7a63" font-size="12.5" font-weight="600">the attempts, and the tokens it sampled</text>

  <!-- ============ arrows: grid <-> rollout nodes ============ -->
  <g stroke-width="2.4" opacity="0.9" fill="none">
    <path d="M180 470 C180 410, 210 410, 210 358" stroke="url(#lineUp)" marker-end="url(#arrGreen)"/>
    <path d="M420 508 C420 430, 380 430, 380 358" stroke="url(#lineUp)" marker-end="url(#arrGreen)"/>
    <path d="M660 470 C660 415, 640 415, 640 358" stroke="url(#lineUp)" marker-end="url(#arrGreen)"/>
    <path d="M900 508 C900 430, 830 430, 830 358" stroke="url(#lineUp)" marker-end="url(#arrGreen)"/>
    <path d="M360 640 C360 470, 290 470, 290 358" stroke="url(#lineUp)" marker-end="url(#arrGreen)"/>
    <path d="M700 640 C700 470, 730 470, 730 358" stroke="url(#lineUp)" marker-end="url(#arrGreen)"/>
  </g>

  <!-- the adapter push, down the right edge -->
  <path d="M924 128 C1052 128, 1064 300, 1052 470 C1044 590, 1010 610, 960 612"
        stroke="#e0a020" stroke-width="2.6" stroke-dasharray="7 6" fill="none" marker-end="url(#arrAmber)"/>
  <text x="1064" y="330" text-anchor="middle" fill="#8a6a25" font-size="11.5" font-weight="700" transform="rotate(90 1064 330)">every 2 steps · the new adapter, ~84 MB</text>

  <!-- faint fabric between machines -->
  <g stroke="#9aa6b6" stroke-width="1.5" opacity="0.20" fill="none">
    <line x1="180" y1="514" x2="420" y2="552"/>
    <line x1="420" y1="552" x2="360" y2="684"/>
    <line x1="420" y1="552" x2="660" y2="514"/>
    <line x1="660" y1="514" x2="700" y2="684"/>
    <line x1="660" y1="514" x2="900" y2="552"/>
    <line x1="700" y1="684" x2="900" y2="552"/>
  </g>

  <!-- ============ BOTTOM: rollout nodes ============ -->
  <g>
    <!-- Design Mac -->
    <g filter="url(#sh)"><rect x="86" y="470" width="200" height="104" rx="15" fill="url(#nodeGrad)"/></g>
    <rect x="92" y="475" width="188" height="22" rx="11" fill="#ffffff" opacity="0.10"/>
    <text x="104" y="496" fill="#ffffff" font-size="14.5" font-weight="700">Design Mac</text>
    <text x="104" y="517"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">ENGINE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  MLX</tspan></text>
    <text x="104" y="533"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">HARDWARE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  MacBook Pro M4</tspan></text>
    <text x="104" y="549"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">MEMORY</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  48 GB</tspan></text>
    <text x="104" y="565"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">WRITES</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  2 attempts at a time</tspan></text>
    <use href="#macbook" x="250" y="477" width="28" height="21"/>

    <!-- Studio -->
    <g filter="url(#sh)"><rect x="326" y="508" width="200" height="104" rx="15" fill="url(#nodeGrad)"/></g>
    <rect x="332" y="513" width="188" height="22" rx="11" fill="#ffffff" opacity="0.10"/>
    <text x="344" y="534" fill="#ffffff" font-size="14.5" font-weight="700">Studio<tspan fill="#cfe6f7" font-size="10.5" font-weight="500">   also the judge</tspan></text>
    <text x="344" y="555"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">ENGINE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  MLX</tspan></text>
    <text x="344" y="571"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">HARDWARE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  Mac Studio</tspan></text>
    <text x="344" y="587"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">MEMORY</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  512 GB</tspan></text>
    <text x="344" y="603"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">WRITES</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  8 at a time</tspan></text>
    <use href="#mac-studio" x="492" y="516" width="24" height="21"/>

    <!-- The floor: N laptops -->
    <g filter="url(#sh)"><rect x="566" y="470" width="200" height="104" rx="15" fill="url(#nodeGrad)"/></g>
    <rect x="572" y="475" width="188" height="22" rx="11" fill="#ffffff" opacity="0.10"/>
    <text x="584" y="496" fill="#ffffff" font-size="14.5" font-weight="700">The Floor × 12</text>
    <text x="584" y="517"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">ENGINE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  MLX · grid train serve</tspan></text>
    <text x="584" y="533"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">HARDWARE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  MacBook Pro M3</tspan></text>
    <text x="584" y="549"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">MEMORY</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  36 GB each</tspan></text>
    <text x="584" y="565"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">WRITES</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  1 each · overnight</tspan></text>
    <use href="#macbook" x="730" y="477" width="28" height="21"/>

    <!-- Gaming PC -->
    <g filter="url(#sh)"><rect x="806" y="508" width="200" height="104" rx="15" fill="url(#nodeGrad)"/></g>
    <rect x="812" y="513" width="188" height="22" rx="11" fill="#ffffff" opacity="0.10"/>
    <text x="824" y="534" fill="#ffffff" font-size="14.5" font-weight="700">Gaming PC</text>
    <text x="824" y="555"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">ENGINE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  vLLM</tspan></text>
    <text x="824" y="571"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">HARDWARE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  RTX 4090</tspan></text>
    <text x="824" y="587"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">MEMORY</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  24 GB</tspan></text>
    <text x="824" y="603"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">WRITES</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  8 at a time</tspan></text>
    <use href="#gpu-card" x="968" y="516" width="30" height="17"/>

    <!-- Basement Rig -->
    <g filter="url(#sh)"><rect x="266" y="640" width="200" height="104" rx="15" fill="url(#nodeGrad)"/></g>
    <rect x="272" y="645" width="188" height="22" rx="11" fill="#ffffff" opacity="0.10"/>
    <text x="284" y="666" fill="#ffffff" font-size="14.5" font-weight="700">Basement Rig</text>
    <text x="284" y="687"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">ENGINE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  vLLM</tspan></text>
    <text x="284" y="703"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">HARDWARE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  RTX 3090</tspan></text>
    <text x="284" y="719"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">MEMORY</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  24 GB</tspan></text>
    <text x="284" y="735"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">WRITES</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  4 at a time</tspan></text>
    <use href="#gpu-card" x="428" y="648" width="30" height="17"/>

    <!-- Workstation -->
    <g filter="url(#sh)"><rect x="606" y="640" width="200" height="104" rx="15" fill="url(#nodeGrad)"/></g>
    <rect x="612" y="645" width="188" height="22" rx="11" fill="#ffffff" opacity="0.10"/>
    <text x="624" y="666" fill="#ffffff" font-size="14.5" font-weight="700">Workstation</text>
    <text x="624" y="687"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">ENGINE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  vLLM</tspan></text>
    <text x="624" y="703"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">HARDWARE</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  RTX PRO 6000</tspan></text>
    <text x="624" y="719"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">MEMORY</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  96 GB</tspan></text>
    <text x="624" y="735"><tspan fill="#bcd9ef" font-size="9.5" letter-spacing="0.6">WRITES</tspan><tspan fill="#ffffff" font-weight="700" font-size="12">  16 · or trains</tspan></text>
    <use href="#gpu-card" x="768" y="648" width="30" height="17"/>
  </g>

  <!-- ============ bottom label ============ -->
  <text x="560" y="782" text-anchor="middle" fill="#5b6b85" font-size="13.5" letter-spacing="2.5" font-weight="700">ROLLOUT NODES — THEY WRITE THE ATTEMPTS</text>
  <text x="560" y="801" text-anchor="middle" fill="#5b6b85" font-size="14">about 75% of the compute, and it is plain inference — the machines you already own</text>
</svg>
